name: QAVENO Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx tsc -p tsconfig.build.json

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAVENO-Setup
          path: dist-electron/*.exe
          retention-days: 30

  release:
    needs: build-electron
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QAVENO-Setup
          path: dist-electron/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qaveno_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: qaveno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npx tsc -p tsconfig.build.json

      - name: Run backend tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: qaveno_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: qaveno_test
          JWT_SECRET: test-secret-for-ci-only-32chars!!
        run: npx jest --runInBand --forceExit --testTimeout 120000 --testMatch "**/*.e2e-spec.ts"
