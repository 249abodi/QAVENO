appId: com.qaveno.desktop
productName: QAVENO
copyright: Copyright (C) 2026 QAVENO

directories:
  output: dist-electron
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - "!tests/**"
  - "!scripts/**"
  - "!backend/**"
  - "!.env*"
  - "!docker-compose.yml"
  - "!*.md"

asarUnpack:
  - "**/*.node"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: "QAVENO-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QAVENO

extraMetadata:
  main: src/main/main.js

compression: maximum

publish:
  provider: github
  owner: 249abodi
  repo: QAVENO
  releaseType: release